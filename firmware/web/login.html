<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1e27">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Water">
<link rel="icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Sign in</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #0f1e27; color: #e4eff3; }
body {
  min-height: 100vh; display: grid; place-items: center; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
}
form { width: 100%; max-width: 340px; }
h1 { font: 600 28px/1.2 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; margin: 0 0 20px; }
input, button { width: 100%; font: inherit; border-radius: 14px; padding: 15px 16px; }
input { border: 1px solid #27465a; background: #162a35; color: inherit; }
button { margin-top: 12px; border: 0; background: #56c2e6; color: #0f1e27; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; }
:focus-visible { outline: 2px solid #56c2e6; outline-offset: 3px; }
p { min-height: 1.5em; margin: 12px 2px 0; color: #ffb4a9; }
</style>
</head>
<body>
<form id="form">
  <h1>Sign in</h1>
  <label for="password" hidden>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <button id="submit">Sign in</button>
  <p id="message" role="alert"></p>
</form>
<script>
"use strict";
const form = document.getElementById("form");
const button = document.getElementById("submit");
const message = document.getElementById("message");
let wait = 0;

function countdown(ms) {
  clearInterval(wait);
  const until = Date.now() + ms;
  button.disabled = true;
  const tick = () => {
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) { clearInterval(wait); button.disabled = false; message.textContent = ""; return; }
    message.textContent = `Wrong password. Try again in ${left} s.`;
  };
  tick();
  wait = setInterval(tick, 250);
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  button.disabled = true;
  message.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: document.getElementById("password").value}),
    });
    if (r.ok) { location.replace("/"); return; }
    const data = await r.json().catch(() => ({}));
    if (data.retry_after_ms) { countdown(data.retry_after_ms); return; }
    message.textContent = data.error === "login_disabled" ? "Sign-in is turned off on this device." : "Sign-in failed.";
  } catch (err) {
    message.textContent = "Can’t reach the device.";
  }
  button.disabled = false;
});
</script>
</body>
</html>
